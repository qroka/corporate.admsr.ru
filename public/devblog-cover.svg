<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Девблог портала">
  <!-- Стандартная обложка девблога (ADR-052). Картинка, а не интерфейс: цвета заданы явно. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- «окно редактора» -->
  <g transform="translate(640 150)">
    <rect width="440" height="300" rx="28" fill="#0f0d2e" fill-opacity="0.55" stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="40" cy="38" r="9" fill="#f87171"/>
    <circle cx="70" cy="38" r="9" fill="#fbbf24"/>
    <circle cx="100" cy="38" r="9" fill="#34d399"/>
    <rect x="40" y="88" width="64" height="16" rx="8" fill="#a78bfa"/>
    <rect x="116" y="88" width="210" height="16" rx="8" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="64" y="132" width="250" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="64" y="166" width="300" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="64" y="200" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <circle cx="46" cy="139" r="6" fill="#c4b5fd"/>
    <circle cx="46" cy="173" r="6" fill="#c4b5fd"/>
    <circle cx="46" cy="207" r="6" fill="#c4b5fd"/>
    <rect x="40" y="244" width="120" height="30" rx="15" fill="#8b5cf6"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" fill="#ffffff">
    <text x="110" y="300" font-size="40" font-weight="600" fill="#c4b5fd">&lt;/&gt;  обновление портала</text>
    <text x="104" y="410" font-size="120" font-weight="800">Девблог</text>
    <text x="110" y="480" font-size="38" fill-opacity="0.8">Что нового и что изменилось</text>
  </g>
</svg>
