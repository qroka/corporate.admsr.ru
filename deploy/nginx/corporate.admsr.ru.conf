# ============================================================================
#  nginx — corporate.admsr.ru  (HTTPS / TLS)
#  Vue SPA (dist/) + PHP-FPM (api/*.php) + загрузки (/img/).
# ----------------------------------------------------------------------------
#  ПЕРЕД ПРИМЕНЕНИЕМ проверь/подставь под свой сервер 3 места ниже:
#    1) root            — путь к папке сайта на сервере
#    2) fastcgi_pass    — сокет/версия PHP-FPM
#    3) пути к сертификату/ключу (если положишь не в /etc/nginx/ssl/admsr.ru/)
# ============================================================================

# --- HTTP → HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name corporate.admsr.ru;
    return 301 https://$host$request_uri;
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name corporate.admsr.ru;

    # (1) КОРЕНЬ САЙТА — сюда заливается содержимое dist/ + папка api/ + img/
    root  /var/www/corporate.admsr.ru;
    index index.html;

    # ----- Сертификаты (wildcard *.admsr.ru покрывает этот поддомен) -----
    ssl_certificate     /etc/nginx/ssl/admsr.ru/admsr.crt;   # fullchain
    ssl_certificate_key /etc/nginx/ssl/admsr.ru/admsr.key;

    # ----- Параметры TLS -----
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # HSTS: включай ПОСЛЕ того как убедишься, что https работает
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/corporate.admsr.ru.access.log;
    error_log  /var/log/nginx/corporate.admsr.ru.error.log;

    client_max_body_size 25m;     # upload.php принимает файлы до 20 МБ

    # ----- PHP API (events.php, auth.php, chat.php, forms*.php, news.php, ...) -----
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;   # чат к AI может отвечать долго
    }

    # ----- Загруженные изображения -----
    location /img/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # ----- Хешированные ассеты Vite -----
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- SPA fallback (vue-router history mode) -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
