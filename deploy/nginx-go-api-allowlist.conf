# Go API — proxy allowlist snippet
#
# Include these exact `location =` blocks *before* the PHP `location ~ ^/api/` regex.
# Upstream must be defined once in the http{} context (or at the top of the site file).
#
# Migrated (current):
#   health, auth, logout, check-auth, heartbeat, session_bootstrap, news
#
# To roll back an endpoint: delete its `location =` block and reload nginx.

upstream go_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

