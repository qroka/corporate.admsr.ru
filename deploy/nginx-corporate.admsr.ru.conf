# ============================================================================
#  nginx — corporate.admsr.ru  (HTTPS / TLS)
#  Vue SPA (dist/) + Go API (migrated endpoints) + PHP-FPM fallback + /img/
#
#  Установка:
#    sudo cp deploy/nginx-corporate.admsr.ru.conf /etc/nginx/sites-available/corporate.admsr.ru
#    sudo ln -sf /etc/nginx/sites-available/corporate.admsr.ru /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Go API (systemd / manual):
#    cd /var/www/corporate.admsr.ru/backend && ./bin/api
#    listens on 127.0.0.1:8080 by default (HTTP_ADDR)
# ============================================================================

upstream go_api {
    # 8080 на corporate-testing занят sites-available/api — используем 8081
    server 127.0.0.1:8081;
    keepalive 16;
}

# --- HTTP → HTTPS -----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name corporate.admsr.ru;
    return 301 https://$host$request_uri;
}

# --- HTTPS ------------------------------------------------------------------
server {
    # http2 via listen flag — совместимо с nginx < 1.25.1 (без директивы "http2 on;")
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corporate.admsr.ru;

    # Корень SPA (результат npm run build)
    root  /var/www/corporate.admsr.ru/dist;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/admsr.ru/admsr.crt;
    ssl_certificate_key /etc/nginx/ssl/admsr.ru/admsr.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/corporate.admsr.ru.access.log;
    error_log  /var/log/nginx/corporate.admsr.ru.error.log;

    client_max_body_size 25m;

    # ----- Go API (allowlist — expand as endpoints are migrated) --------------
    # Exact matches take precedence over the PHP regex below.
    location = /api/health.php {
        proxy_pass http://go_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
    }
    location = /api/auth.php {
        proxy_pass http://go_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
