    }
    include /var/www/corporate.admsr.ru/deploy/nginx-go-api-wave2.conf;

    # ----- PHP API (fallback for not-yet-migrated endpoints) ------------------
    location ~ ^/api/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/corporate.admsr.ru/api/$1;
        # Authorization для Bearer sessionToken модуля курсов
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
    }

    # ----- Загруженные файлы (вне git) ----------------------------------------
    location /img/ {
        alias /var/lib/corporate-app/uploads/img/;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # ----- Vite assets --------------------------------------------------------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
